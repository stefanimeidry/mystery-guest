<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Mystery Character Swap</title>
    <style>
    /* 1. Page Backdrop: Smooth, professional pastel aura gradient */
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%), 
                    radial-gradient(circle at 10% 20%, rgba(243, 231, 233, 0.5) 0%, rgba(229, 239, 253, 0.5) 90%);
        background-attachment: fixed;
        color: #2d3748; 
        margin: 0; 
        padding: 40px 20px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        min-height: 100vh;
        box-sizing: border-box;
    }

    /* 2. Frosted Containers: Floating glass layout frames */
    .container { 
        max-width: 580px; 
        width: 100%; 
        background: rgba(255, 255, 255, 0.85); 
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 35px; 
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(148, 163, 184, 0.12), 
                    0 1px 3px rgba(148, 163, 184, 0.04);
        margin-bottom: 30px; 
        box-sizing: border-box; 
        border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h1 { margin-top: 0; color: #0f172a; text-align: center; font-size: 1.8rem; font-weight: 700; letter-spacing: -0.025em; }
    h2 { margin-top: 0; color: #0f172a; text-align: center; font-size: 1.5rem; font-weight: 700; }
    h3 { color: #334155; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }

    /* 3. Status Count Box: Clean sky-blue notification window */
    .status-box { 
        background: #f0f7ff; 
        border: 1px solid #e0f2fe; 
        padding: 14px; 
        border-radius: 12px; 
        text-align: center; 
        font-weight: 600; 
        font-size: 1.1rem; 
        color: #0369a1; 
        margin-bottom: 25px; 
    }

    label { font-weight: 500; display: block; margin-bottom: 8px; color: #475569; font-size: 0.95rem; }
    
    /* 4. Input Elements: Soft focus behavior with smooth border animations */
    input, textarea { 
        width: 100%; 
        padding: 12px 16px; 
        margin-bottom: 20px; 
        border: 1px solid #cbd5e1; 
        border-radius: 10px; 
        font-size: 1rem; 
        background: rgba(255, 255, 255, 0.7);
        box-sizing: border-box; 
        transition: all 0.2s ease-in-out;
        color: #1e293b;
    }
    input:focus, textarea:focus {
        outline: none;
        border-color: #3b82f6;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    /* 5. Buttons: Smooth transitions and hover animations */
    button { 
        width: 100%; 
        padding: 14px; 
        border: none; 
        border-radius: 10px; 
        font-size: 1rem; 
        font-weight: 600; 
        cursor: pointer; 
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        margin-bottom: 10px; 
    }
    .btn-primary { background: #3b82f6; color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3); }
    .btn-primary:active { transform: translateY(0); }
    
    .btn-danger { background: #ef4444; color: #fff; margin-top: 15px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15); }
    .btn-danger:hover { background: #dc2626; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.25); }

    button:disabled { background: #e2e8f0 !important; color: #94a3b8 !important; transform: none !important; box-shadow: none !important; cursor: not-allowed; }

    /* 6. Active Rosters Tags: Pill layout designs */
    .character-tag { 
        display: inline-block; 
        background: #ffffff; 
        padding: 8px 16px; 
        margin: 6px 4px; 
        border-radius: 30px; 
        font-size: 0.9rem; 
        border: 1px solid #e2e8f0; 
        font-weight: 500; 
        color: #334155;
        box-shadow: 0 2px 4px rgba(148, 163, 184, 0.05);
    }

    /* 7. Output Cards: Subtle dashed borders for clear readability */
    .result-box { 
        background: #f0fdf4; 
        border: 2px dashed #4ade80; 
        border-radius: 14px; 
        padding: 20px; 
        margin-top: 20px; 
        text-align: center; 
        box-shadow: 0 4px 12px rgba(74, 222, 128, 0.08);
    }
</style>
</head>
<body>

    <!-- LOBBY & REGISTRATION SUBMISSION -->
    <div class="container" id="registrationContainer">
        <h1>🎭 Secure Mystery Character Swap</h1>
        <div class="status-box" id="statusCount">Fetching lobby entries count...</div>

        <form id="submissionForm">
            <label for="charName">Your Chosen Mystery Character Name</label>
            <input type="text" id="charName" placeholder="e.g. Batman, Pikachu, Cinderella" required>

            <label for="charClue">Short Description/Clues (Keep your real identity a secret!)</label>
            <textarea id="charClue" rows="3" placeholder="Describe character quirks, quotes, or likes..." required></textarea>

            <label for="userPass">Create a Private Password (To claim your match later)</label>
            <input type="password" id="userPass" placeholder="Enter a password you will remember" required>

            <button type="submit" class="btn-primary" id="submitBtn">Submit Character Anonymously</button>
        </form>

        <h3 style="margin-top: 25px;">Lobby Rosters</h3>
        <div id="characterLobby">Waiting for participants to join...</div>

        <!-- MANUAL ADMIN TRIGGER BUTTON -->
        <button type="button" class="btn-danger" id="triggerBtn" onclick="triggerMatchup()">Lock Lobby & Generate Matches (Organizer Only)</button>
    </div>

    <!-- MATCH ASSIGNMENT REVEAL LOOKUP -->
    <div class="container" id="lookupContainer" style="display:none;">
        <h2>🎁 Claim Your Target Match</h2>
        <p style="text-align:center; font-size:0.9rem; color:#64748b;">The host has officially rolled the matches! Input your credentials below to see your assignment target.</p>
        
        <label for="loginName">Your Submitted Character Name</label>
        <input type="text" id="loginName" placeholder="Enter your profile name" required>

        <label for="loginPass">Your Private Password</label>
        <input type="password" id="loginPass" placeholder="Enter your passkey" required>

        <button type="button" class="btn-primary" id="lookupBtn" onclick="fetchTargetMatch()">Reveal My Assignment Target</button>
        
        <div id="matchOutput"></div>
    </div>

    <script>
        // ⚠️ CONFIGURATION: Replace this string with your exact Apps Script Web App URL
        const DEPLOYED_API_URL = "https://script.google.com/macros/s/AKfycbyCOvEDOPipvixAAOXYHXODyunu-GMollu5cfYi66P-lznPaz57pwxZKLH7U8WKqv1q0g/exec";

        async function updateDashboard() {
            try {
                const response = await fetch(`${DEPLOYED_API_URL}?action=getStatus`);
                const data = await response.json();
                
                if (data.status === "success") {
                    const currentCount = data.count;
                    document.getElementById("statusCount").innerText = `Total Participants In Lobby: ${currentCount}`;
                    
                    if(data.characters.length > 0) {
                        document.getElementById("characterLobby").innerHTML = data.characters.map(name => `<span class="character-tag">🎭 ${name}</span>`).join('');
                    } else {
                        document.getElementById("characterLobby").innerText = "Lobby is empty. Be the first to join!";
                    }

                    // If matches are already rolled, flip interface status rules immediately
                    if (data.isLocked) {
                        document.getElementById("submitBtn").disabled = true;
                        document.getElementById("submitBtn").innerText = "Registration Closed";
                        document.getElementById("triggerBtn").style.display = "none";
                        document.getElementById("lookupContainer").style.display = "block";
                    }
                }
            } catch (err) {
                console.error("Connection error:", err);
            }
        }

        document.getElementById("submissionForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "Submitting entry...";

            const name = encodeURIComponent(document.getElementById("charName").value);
            const clue = encodeURIComponent(document.getElementById("charClue").value);
            const password = encodeURIComponent(document.getElementById("userPass").value);

            try {
                const res = await fetch(`${DEPLOYED_API_URL}?action=submit&name=${name}&clue=${clue}&password=${password}`);
                const result = await res.json();
                alert(result.message);
                if (result.status === "success") {
                    document.getElementById("submissionForm").reset();
                }
            } catch (err) {
                alert("Submission connection pipeline failed.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Character Anonymously";
                updateDashboard();
            }
        });

        async function triggerMatchup() {
            const organizerPin = prompt("Organizer Authorization Required:\nPlease enter the Host Passcode to lock registrations and pair characters:");
            
            if (organizerPin === null) return; // User hit cancel
            if (organizerPin.trim() === "") {
                alert("Passcode cannot be empty.");
                return;
            }

            const btn = document.getElementById("triggerBtn");
            btn.disabled = true;
            btn.innerText = "Validating credentials and shifting rows...";

            try {
                const res = await fetch(`${DEPLOYED_API_URL}?action=startMatchup&pin=${encodeURIComponent(organizerPin)}`);
                const result = await res.json();
                alert(result.message);
            } catch (err) {
                alert("Failed to trigger backend validation workflow.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Lock Lobby & Generate Matches (Organizer Only)";
                updateDashboard();
            }
        }

        async function fetchTargetMatch() {
            const output = document.getElementById("matchOutput");
            const btn = document.getElementById("lookupBtn");
            
            const name = encodeURIComponent(document.getElementById("loginName").value);
            const password = encodeURIComponent(document.getElementById("loginPass").value);

            btn.disabled = true;
            output.innerHTML = "Querying secret index...";

            try {
                const res = await fetch(`${DEPLOYED_API_URL}?action=getMatch&name=${name}&password=${password}`);
                const result = await res.json();
                
                if (result.status === "success") {
                    output.innerHTML = `
                        <div class="result-box">
                            <h3 style="color:#065f46; margin-top:0;">Your Assigned Target:</h3>
                            <p style="font-size:1.4rem; margin:5px 0;"><strong>🎯 ${result.targetName}</strong></p>
                            <hr style="border:0; border-top:1px solid #a7f3d0; margin:10px 0;">
                            <p style="font-size:0.95rem; color:#065f46; text-align:left;"><strong>Their Clue Matrix:</strong><br>${result.targetClue}</p>
                        </div>`;
                } else {
                    output.innerHTML = `<p style="color:#dc2626; text-align:center; font-weight:bold;">❌ ${result.message}</p>`;
                }
            } catch (err) {
                output.innerHTML = `<p style="color:#dc2626; text-align:center;">Handoff pipeline error.</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        // Run sync loops immediately
        updateDashboard();
    </script>
</body>
</html>
