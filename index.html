<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Character Exchange Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        h1, h2 { margin-top: 0; color: #1e293b; text-align: center; }
        .progress-bar-container { background: #e2e8f0; border-radius: 20px; height: 20px; width: 100%; margin: 15px 0; overflow: hidden; position: relative; }
        .progress-bar { background: #10b981; height: 100%; width: 0%; transition: width 0.4s ease; }
        .status-text { text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 1.1rem; }
        label { font-weight: 600; display: block; margin-bottom: 6px; color: #475569; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: #fff; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        .character-tag { display: inline-block; background: #f1f5f9; padding: 6px 12px; margin: 4px; border-radius: 20px; font-size: 0.9rem; border: 1px solid #e2e8f0; font-weight: 500; }
        .result-box { background: #ecfdf5; border: 2px dashed #10b981; border-radius: 8px; padding: 15px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <!-- PHASE 1 & 2: Tracker & Registration Submission -->
    <div class="container" id="registrationContainer">
        <h1>🎭 Mystery Character Swap</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusCount">Loading lobby data...</div>

        <form id="submissionForm">
            <label for="charName">Your Chosen Mystery Character Name</label>
            <input type="text" id="charName" placeholder="e.g. Batman, Pikachu, Sherlock Holmes" required>

            <label for="charClue">Short Description/Clues (Don't give away your real identity!)</label>
            <textarea id="charClue" rows="3" placeholder="Describe your character traits or likes..." required></textarea>

            <label for="userPass">Create a Secret Private Password (To claim your match later)</label>
            <input type="password" id="userPass" placeholder="Enter a password you will remember" required>

            <button type="submit" id="submitBtn">Submit Character Anonymously</button>
        </form>

        <h3 style="margin-top: 25px;">Registered Characters Lobby</h3>
        <div id="characterLobby">None yet.</div>
    </div>

    <!-- PHASE 3: Matches & Assignment Lookup Dashboard -->
    <div class="container" id="lookupContainer" style="display:none;">
        <h2>🎁 Claim Your Target Match</h2>
        <p style="text-align:center; font-size:0.9rem; color:#64748b;">All 14 participants have submitted. Enter the credentials you created above to find your target!</p>
        
        <label for="loginName">Your Submitted Character Name</label>
        <input type="text" id="loginName" placeholder="Enter your submitted character profile name" required>

        <label for="loginPass">Your Secret Private Password</label>
        <input type="password" id="loginPass" placeholder="Enter your passkey" required>

        <button type="button" id="lookupBtn" onclick="fetchTargetMatch()">Reveal My Assignment Target</button>
        
        <div id="matchOutput"></div>
    </div>

    <script>
        // ⚠️ CRITICAL CONFIGURATION: Replace this string with your exact Google Web App Executable URL 
        const DEPLOYED_API_URL = "https://script.google.com/macros/s/AKfycbyCOvEDOPipvixAAOXYHXODyunu-GMollu5cfYi66P-lznPaz57pwxZKLH7U8WKqv1q0g/exec";

        async function updateDashboard() {
            try {
                const response = await fetch(`${DEPLOYED_API_URL}?action=getStatus`);
                const data = await response.json();
                
                if (data.status === "success") {
                    const currentCount = data.count;
                    document.getElementById("statusCount").innerText = `Submissions: ${currentCount} / 14 Registered`;
                    document.getElementById("progressBar").style.width = `${(currentCount / 14) * 100}%`;
                    
                    // Render current character names anonymously
                    if(data.characters.length > 0) {
                        document.getElementById("characterLobby").innerHTML = data.characters.map(name => `<span class="character-tag">🎭 ${name}</span>`).join('');
                    }

                    // Toggle phase view when max threshold is achieved
                    if (data.isLocked || currentCount >= 14) {
                        document.getElementById("submitBtn").disabled = true;
                        document.getElementById("submitBtn").innerText = "Registration Closed (Max limit reached)";
                        document.getElementById("lookupContainer").style.display = "block";
                    }
                }
            } catch (err) {
                console.error("Error communicating with Sheet API backend:", err);
            }
        }

        document.getElementById("submissionForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing submission...";

            const name = encodeURIComponent(document.getElementById("charName").value);
            const clue = encodeURIComponent(document.getElementById("charClue").value);
            const password = encodeURIComponent(document.getElementById("userPass").value);

            try {
                const res = await fetch(`${DEPLOYED_API_URL}?action=submit&name=${name}&clue=${clue}&password=${password}`);
                const result = await res.json();
                alert(result.message);
                if (result.status === "success") {
                    document.getElementById("submissionForm").reset();
                }
            } catch (err) {
                alert("Submission failed. Ensure Web App URL configuration parameters match.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Character Anonymously";
                updateDashboard();
            }
        });

        async function fetchTargetMatch() {
            const output = document.getElementById("matchOutput");
            const btn = document.getElementById("lookupBtn");
            
            const name = encodeURIComponent(document.getElementById("loginName").value);
            const password = encodeURIComponent(document.getElementById("loginPass").value);

            btn.disabled = true;
            output.innerHTML = "Searching assignments records...";

            try {
                const res = await fetch(`${DEPLOYED_API_URL}?action=getMatch&name=${name}&password=${password}`);
                const result = await res.json();
                
                if (result.status === "success") {
                    output.innerHTML = `
                        <div class="result-box">
                            <h3 style="color:#065f46; margin-top:0;">Your Assigned Target:</h3>
                            <p style="font-size:1.3rem; margin:5px 0;"><strong>🎯 ${result.targetName}</strong></p>
                            <hr style="border:0; border-top:1px solid #a7f3d0; margin:10px 0;">
                            <p style="font-size:0.95rem; color:#065f46; text-align:left;"><strong>Their Clue Matrix:</strong><br>${result.targetClue}</p>
                        </div>`;
                } else {
                    output.innerHTML = `<p style="color:#dc2626; text-align:center; font-weight:bold;">❌ ${result.message}</p>`;
                }
            } catch (err) {
                output.innerHTML = `<p style="color:#dc2626; text-align:center;">Network handoff transmission error.</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        // Initialize dashboard sync data loops immediately upon load
        updateDashboard();
    </script>
</body>
</html>
